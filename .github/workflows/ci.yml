name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -r requirements.txt
      - name: Import checks
        run: python -m compileall api.py app.py src scripts tests
      - name: No hardcoded fake UI metrics
        run: |
          ! grep -R "Precision@5.*0\\.88\\|185ms\\|91% accuracy" README.md app.py
      - name: Tests
        run: python -m pytest
